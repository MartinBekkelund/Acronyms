name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Check syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Build the same file set that goes to WordPress.org, in a folder named after the slug.
      - name: Build plugin folder
        run: mkdir -p build && rsync -a --exclude-from=.distignore ./ build/acronym-tooltips/
      - uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: 'build/acronym-tooltips'
